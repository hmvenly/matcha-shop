<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Neko Matcha</title>
    
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/styles/style.css"> 

    <style>
        body {
            background-color: #f8f6f0; /* Signature beige background */
        }
        
        /* The Dashboard Card */
        .dashboard-card {
            background-color: #eae5d9; /* Slightly darker beige for contrast */
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            max-width: 450px;
            margin: 60px auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        /* Aesthetic Corner Accent */
        .dashboard-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background-color: var(--matcha-dark);
            border-radius: 50%;
            opacity: 0.1;
        }

        .points-number {
            font-size: 5.5rem;
            font-weight: 600;
            color: var(--matcha-dark);
            line-height: 1;
            margin: 20px 0 5px 0;
            letter-spacing: -2px;
        }

        /* Custom Progress Bar */
        .rewards-progress {
            height: 8px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0 10px 0;
        }

        .progress-bar {
            background-color: var(--matcha-dark);
            transition: width 1s ease-in-out;
        }

        .dashboard-btn {
            background-color: var(--matcha-dark);
            color: white;
            border-radius: 30px;
            padding: 15px;
            font-weight: 600;
            border: none;
            transition: transform 0.3s ease;
        }

        .dashboard-btn:hover {
            transform: translateY(-3px);
            background-color: #1f2a22;
            color: white;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100"> 

    <header class="container mt-3"> 
        <div class="logo">
            <h1>ネコ抹茶</h1>
            <p>Neko Matcha</p>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="our-matcha.html">Our Matcha</a></li>
                <li><a href="cafe.html">Cafe</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" id="accountLink" style="color: var(--matcha-dark); font-weight: 600;">Account <i class="fa-solid fa-user"></i></a></li> 
            </ul>
        </nav>
    </header>

    <main class="container flex-grow-1">
        <div class="dashboard-card">
            
            <h2 id="welcomeName" style="color: var(--matcha-dark); font-weight: 600; font-size: 2rem;">Welcome, Matcha Lover!</h2>
            <p class="text-muted mb-4">Here is your energy balance.</p>

            <!-- Dynamic Points Display -->
            <div class="points-number" id="userPoints">0</div>
            <p style="font-weight: 600; letter-spacing: 2px; font-size: 0.9rem; color: #666;">MATCHA POINTS</p>

            <!-- Rewards Tracker -->
            <div class="mt-4 pt-3" style="border-top: 1px solid rgba(0,0,0,0.05);">
                <div class="rewards-progress">
                    <div class="progress-bar" id="pointsProgress" style="width: 0%"></div>
                </div>
                <p id="pointsMessage" style="font-size: 0.9rem; color: #8c9e83; font-weight: 600;">Loading rewards...</p>
            </div>

            <a href="our-matcha.html" class="btn dashboard-btn w-100 mt-4 text-decoration-none">Order & Earn More</a>
        </div>
    </main>

    <!-- External Libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/SlickNav/1.0.10/jquery.slicknav.min.js"></script>
    
    <!-- Core Scripts -->
    <script src="assets/scripts/data.js"></script>
    <script src="assets/scripts/auth.js"></script> 

    <!-- PAGE SPECIFIC LOGIC: Read the user's data and update the screen -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Grab the active user from the browser memory
            const activeSession = JSON.parse(localStorage.getItem("nekoUser"));

            // 2. SECURITY CHECK: If they aren't logged in, kick them back to login page!
            if (!activeSession) {
                window.location.href = "login.html";
                return;
            }

            // 3. Update the text on the screen
            document.getElementById("welcomeName").innerText = `Welcome, ${activeSession.id}!`;
            
            // Add a cool counting animation for the points
            let currentPoints = 0;
            const targetPoints = activeSession.points;
            const counter = setInterval(() => {
                if (currentPoints >= targetPoints) {
                    clearInterval(counter);
                    document.getElementById("userPoints").innerText = targetPoints;
                } else {
                    currentPoints += Math.ceil(targetPoints / 20); // Speed of counting
                    document.getElementById("userPoints").innerText = currentPoints;
                }
            }, 30);

            // 4. Calculate the progress bar (Goal: 500 points for a free drink)
            const goalPoints = 500;
            const percentage = Math.min((activeSession.points / goalPoints) * 100, 100);
            
            setTimeout(() => {
                document.getElementById("pointsProgress").style.width = `${percentage}%`;
            }, 300); // Slight delay so the animation looks cool

            const pointsNeeded = goalPoints - activeSession.points;
            if (pointsNeeded > 0) {
                document.getElementById("pointsMessage").innerText = `Only ${pointsNeeded} points until a free drink! 🍵`;
            } else {
                document.getElementById("pointsMessage").innerText = `You have a free drink waiting! 🎉`;
            }
        });
    </script>
</body>
</html>
