<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Neko Matcha</title>
    
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/styles/style.css"> 
</head>
<body class="d-flex flex-column min-vh-100 bg-light"> 

    <header class="container mt-3"> 
        <div class="logo">
            <h1>ネコ抹茶</h1>
            <p>Neko Matcha</p>
        </div>
               <nav class="menu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="our-matcha.html">Our Matcha</a></li>
            <li><a href="cafe.html">Cafe</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html" id="accountLink">Account <i class="fa-solid fa-user"></i></a></li> 
        </ul>
    </nav>
    </header>

    <main class="container d-flex justify-content-center align-items-center flex-grow-1 mt-5">
        <div class="card shadow p-5 rounded-4 border-0" style="max-width: 400px; width: 100%;">
            <h2 class="text-center mb-3" style="color: var(--matcha-dark);">Welcome Back</h2>
            <p class="text-center text-muted mb-4">Enter details to check your rewards!</p>
            
            <form id="loginForm">
                <div class="mb-3">
                    <input type="text" id="loginId" class="form-control p-3" placeholder="Your ID" style="border-radius: 12px; border: 2px solid #eae5d9;">
                </div>
                <div class="mb-3">
                    <input type="password" id="loginPass" class="form-control p-3" placeholder="Password" style="border-radius: 12px; border: 2px solid #eae5d9;">
                </div>
                <button type="button" id="loginSubmit" class="btn w-100 py-3 mt-2" style="background-color: var(--matcha-dark); color: white; border-radius: 25px; font-weight: 600;">Login</button>
            </form>

            <p class="text-center mt-4 mb-0" style="font-size: 0.9rem;">
                New here? <a href="register.html" style="color: var(--matcha-dark); font-weight: 600; text-decoration: none;">Sign up</a>
            </p>
        </div>
    </main>
    
    <div id="toastBox" class="toast-box"></div>
    <!-- External Libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/SlickNav/1.0.10/jquery.slicknav.min.js"></script>
    
   <!-- shared Data -->
    <script src="assets/scripts/data.js"></script>
    
    <!-- main logic scripts  -->
    <script src="assets/scripts/auth.js"></script>
</body>
</html>
