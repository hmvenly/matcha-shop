<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Neko Matcha</title>
    
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header class="container mt-3">
        <div class="logo">
            <h1>ネコ抹茶 HQ</h1>
            <p>Admin Dashboard</p>
        </div>
               <nav class="menu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="our-matcha.html">Our Matcha</a></li>
            <li><a href="cafe.html">Cafe</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html" id="accountLink">Account <i class="fa-solid fa-user"></i></a></li> 
        </ul>
    </nav>
    </header>

    <main class="container flex-grow-1 mt-5">
        <div class="row">
            
            
            <div class="col-md-4 mb-4">
                <div class="card w-100 shadow-sm p-4 border-0 rounded-4" style="background: rgba(255, 255, 255, 0.9);">
                    <h3 class="mb-4" style="color: var(--matcha-dark);">Add New Item!</h3>
                    
                    <form id="addDrinkForm">
                        <input type="text" id="drinkId" class="form-control mb-3 p-3" placeholder="Item ID (e.g., drink_04)" style="border-radius: 12px; border: 2px solid #eae5d9;">
                        
                        <input type="text" id="drinkName" class="form-control mb-3 p-3" placeholder="Item Name" style="border-radius: 12px; border: 2px solid #eae5d9;">
                        
                        <textarea id="drinkDesc" class="form-control mb-3 p-3" placeholder="Short Description..." rows="2" style="border-radius: 12px; border: 2px solid #eae5d9;"></textarea>
                        
                        <div class="d-flex gap-2 mb-3">
                            <input type="number" id="drinkPrice" class="form-control p-3" placeholder="Price ($)" step="0.01" style="border-radius: 12px; border: 2px solid #eae5d9;">
                            <input type="number" id="drinkPoints" class="form-control p-3" placeholder="Points" style="border-radius: 12px; border: 2px solid #eae5d9;">
                        </div>

                        <!-- Image Selector -->
                       <select id="drinkImg" class="form-select mb-4 p-3" style="border-radius: 12px; border: 2px solid #eae5d9;">
                            <option value="assets/images/latte.png">Ceremonial Iced Matcha</option>
                            <option value="assets/images/matchastrawberry.jpg">Strawberry Matcha Cloud</option>
                            <option value="assets/images/matcha.jpg">Matcha Latte</option>
                            <option value="assets/images/ChocoMatcha.jpg">Choco Matcha (JPG)</option>
                        </select>

                        <button type="button" id="addDrinkBtn" class="btn w-100 py-3" style="background-color: var(--matcha-dark); color: white; border-radius: 25px; font-weight: 600;">Add to Menu</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card w-100 shadow-sm p-4 border-0 rounded-4" style="background: rgba(255, 255, 255, 0.9);">
                    <h3 class="mb-4" style="color: var(--matcha-dark);">Current Menu 🍵</h3>
                    
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th style="color: var(--text-light);">Image</th>
                                    <th style="color: var(--text-light);">Name</th>
                                    <th style="color: var(--text-light);">Price</th>
                                    <th style="color: var(--text-light);">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="adminMenuBody">

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>
    <div id="toastBox" class="toast-box"></div>

    <script src="assets/scripts/data.js"></script>
    <script src="assets/scripts/main.js"></script>
    <!--admin js kismi-->
    <script src="assets/scripts/admin.js"></script>
</body>
</html>
