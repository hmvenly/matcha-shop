<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Neko Matcha</title>
    
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/styles/style.css"> 

    <style>
        /* Contact Page Specific Styles */
        body {
            background-color: #f8f6f0; /* Keeping your signature beige */
        }

        .contact-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px; /* Optional: remove if you want sharp square edges like the photo! */
            min-height: 500px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        /* The L-shaped border from your reference image */
        .contact-box {
            border-top: 2px solid var(--matcha-dark);
            border-left: 2px solid var(--matcha-dark);
            padding: 40px 0 20px 40px;
            margin-top: 20px;
            height: 100%;
        }

        /* Bottom-border only inputs */
        .contact-input {
            width: 100%;
            border: none;
            border-bottom: 2px solid var(--matcha-dark);
            background: transparent;
            padding: 10px 0;
            margin-bottom: 30px;
            color: var(--matcha-dark);
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        .contact-input::placeholder {
            color: #8c9e83;
            font-weight: 300;
        }

        .contact-input:focus {
            outline: none;
            border-bottom: 2px solid #8c9e83;
        }

        .contact-btn {
            background-color: var(--matcha-dark);
            color: white;
            border-radius: 30px; /* Pill shape */
            padding: 12px 40px;
            font-weight: 600;
            border: none;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .contact-btn:hover {
            transform: translateY(-3px);
            background-color: #1f2a22;
        }

        /* Info Section Typography */
        .info-title {
            font-weight: 400;
            font-size: 1.1rem;
            color: var(--matcha-dark);
            margin-bottom: 5px;
        }

        .info-text {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .social-icons i {
            font-size: 1.2rem;
            color: var(--matcha-dark);
            margin-right: 15px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .social-icons i:hover {
            color: #8c9e83;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100"> 

    <header class="container mt-3"> 
        <div class="logo">
            <h1>ネコ抹茶</h1>
            <p>Neko Matcha</p>
        </div>
               <nav class="menu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="our-matcha.html">Our Matcha</a></li>
            <li><a href="cafe.html">Cafe</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html" id="accountLink">Account <i class="fa-solid fa-user"></i></a></li> 
        </ul>
    </nav>
    </header>

    <main class="container flex-grow-1 my-5">
        <div class="row align-items-stretch">
            
            <!-- LEFT SIDE: Aesthetic Photo -->
            <div class="col-md-5 mb-5 mb-md-0">
                <!-- Drop an aesthetic, vertical cafe/matcha image into your assets folder and name it contact.jpg! -->
                <img src="assets/images/beyzosnur.png" alt="Aesthetic Matcha Moment" class="contact-img">
            </div>

            <!-- RIGHT SIDE: The Form & Info -->
            <div class="col-md-7 ps-md-5 d-flex flex-column justify-content-center">
                <h1 style="color: var(--matcha-dark); font-weight: 600; font-size: 3.5rem; letter-spacing: -1px;">Contact Us</h1>
                
                <div class="contact-box">
                    <div class="row">
                        
                        <!-- The Form -->
                        <div class="col-sm-7 pe-md-4">
                            <form id="contactForm">
                                <input type="text" class="contact-input" placeholder="Full Name" required>
                                <input type="email" class="contact-input" placeholder="E-mail" required>
                                <textarea class="contact-input" rows="1" placeholder="Message" required style="resize: none;"></textarea>
                                
                                <button type="button" class="contact-btn mt-2" onclick="showMessage('Message sent! We will get back to you soon. 🍵', 'success')">Contact Us</button>
                            </form>
                        </div>

                        <!-- The Text Info -->
                        <div class="col-sm-5 mt-5 mt-sm-0">
                            <div class="info-title">Contact</div>
                            <div class="info-text">meow@nekomatcha.com</div>

                            <div class="info-title">Based in</div>
                            <div class="info-text">Ankara, Türkiye</div>

                            <div class="social-icons mt-4 pt-2">
                                <!-- Aishanur's Instagram -->
                                <a href="https://www.instagram.com/nurzlva/" target="_blank" style="text-decoration: none;">
                                    <i class="fa-brands fa-instagram"></i>
                                </a>

                                <!-- Beyza's Instagram -->
                                <a href="https://www.instagram.com/vampiretobat/" target="_blank" style="text-decoration: none;">
                                    <i class="fa-brands fa-instagram"></i>
                                </a>

                                <!-- Beyza's TikTok -->
                                <a href="https://www.tiktok.com/@v4mpcloud" target="_blank" style="text-decoration: none;">
                                    <i class="fa-brands fa-tiktok"></i>
                                </a>

                                <!-- Project GitHub Repository -->
                                <a href="https://github.com/hmvenly/matcha-shop" target="_blank" style="text-decoration: none;">
                                    <i class="fa-brands fa-github"></i>
                                </a>
                            </div>

                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <!-- Toasts Box for the success message -->
    <div id="toastBox" class="toast-box"></div>

    <!-- External Libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/SlickNav/1.0.10/jquery.slicknav.min.js"></script>
    
    <!-- Core Scripts -->
    <script src="assets/scripts/data.js"></script>
    <script src="assets/scripts/auth.js"></script> 
</body>
</html>
